<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Script Lens · interface prototype</title>
<style>
  :root {
    --paper: #F4EEE1; --paper-2: #E8DECB; --white: #FFFDF8;
    --ink: #1B1714; --ink-2: #5A5047;
    --red: #B5382C; --red-tint: #F1D9D2;
    --amber: #A8690A; --amber-tint: #F3E2BF;
    --green: #2E6B4E; --green-tint: #DDE8DC;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #2A2420; color: var(--ink);
    font: 16px/1.45 Arial, "Helvetica Neue", Helvetica, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .pegon { font-family: "Noto Naskh Arabic", "Scheherazade New", Amiri, "Traditional Arabic", "Segoe UI", "Times New Roman", serif; direction: rtl; unicode-bidi: isolate; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

  /* phone frame on wide screens, full screen on a real phone */
  .phone {
    width: 100%; height: 100%; background: var(--paper);
    display: flex; flex-direction: column; position: relative; overflow: hidden;
  }
  @media (min-width: 560px) and (min-height: 700px) {
    .phone { width: 400px; height: min(860px, calc(100vh - 40px)); border-radius: 38px; border: 10px solid var(--ink); box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  }

  header { padding: 14px 16px 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--paper-2); }
  header h1 { font-size: 18px; margin: 0; flex: 1; letter-spacing: .01em; }
  .offline { font-size: 12px; font-weight: 700; color: var(--green); white-space: nowrap; }
  .offline::before { content: "● "; }
  .lang { display: flex; border-radius: 999px; background: var(--paper-2); padding: 3px; }
  .lang button { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  main { flex: 1; overflow-y: auto; padding: 14px 16px 18px; }
  .demo-note { font-size: 12px; color: var(--ink-2); background: var(--paper-2); border-radius: 10px; padding: 8px 10px; margin-bottom: 14px; }

  /* capture screen */
  /* The sample page is a baked-in picture (rendered from the SAMPLE lines) so it reads as a photo, not as typed text. */
  .page {
    position: relative; background: #1C120B; border-radius: var(--radius); overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.25); margin-bottom: 16px;
  }
  .page img { display: block; width: 100%; height: auto; }
  .page .pegon { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .primary { width: 100%; background: var(--ink); color: var(--paper); font-weight: 700; padding: 14px; border-radius: var(--radius); font-size: 16px; }
  .primary:disabled { opacity: .6; cursor: progress; }
  .bar { height: 6px; background: var(--paper-2); border-radius: 99px; overflow: hidden; margin-top: 12px; visibility: hidden; }
  .bar.on { visibility: visible; }
  .bar i { display: block; height: 100%; width: 0; background: var(--red); transition: width 1.1s ease; }
  .bar.on i { width: 100%; }

  /* result screen */
  .status { border-radius: var(--radius); padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
  .status b { display: block; font-size: 15px; }
  .status.draft { background: var(--amber-tint); color: #5C3A05; }
  .status.verified { background: var(--green-tint); color: #1D4633; }
  .meter { display: flex; gap: 10px; margin-bottom: 14px; }
  .meter div { flex: 1; background: var(--white); border-radius: 12px; padding: 10px 12px; }
  .meter strong { display: block; font-size: 24px; line-height: 1.1; }
  .meter span { font-size: 12px; color: var(--ink-2); }

  .line { background: var(--white); border-radius: var(--radius); padding: 12px; margin-bottom: 14px; }
  .line > .pegon { font-size: 25px; line-height: 1.9; text-align: center; padding-bottom: 8px; border-bottom: 1px solid var(--paper-2); }
  .words { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  .word { width: 100%; display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; text-align: left; padding: 8px 10px; border-radius: 10px; background: var(--paper); }
  .word .dot { width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; }
  .word .latin { font-weight: 700; }
  .word .gloss { font-size: 13px; color: var(--ink-2); margin-left: 8px; }
  .word .tag { display: block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .word .pegon { font-size: 22px; line-height: 1.5; }
  .word.sure .dot { background: var(--ink-2); }
  .word.sure .tag { color: var(--ink-2); }
  .word.flag { background: var(--amber-tint); }
  .word.flag .dot { background: var(--amber); }
  .word.flag .latin, .word.flag .tag { color: var(--amber); }
  .word.kept { background: var(--green-tint); }
  .word.kept .dot { background: var(--green); }
  .word.kept .tag { color: var(--green); }
  .gloss-line { font-size: 14px; color: var(--ink-2); margin: 10px 2px 0; }
  .gloss-line b { color: var(--ink); }

  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 4px 2px 8px; }
  .tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tiers button { background: var(--paper-2); border-radius: 10px; padding: 10px 4px; font-size: 14px; font-weight: 700; }
  .tiers button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .tiers button:disabled { opacity: .45; cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--ink-2); margin: 8px 2px 16px; min-height: 1.4em; }
  .ghost { width: 100%; border: 1.5px solid var(--ink-2); border-radius: var(--radius); padding: 11px; font-weight: 700; font-size: 14px; }

  /* keeper sheet */
  .scrim { position: absolute; inset: 0; background: rgba(27,23,20,.55); display: none; align-items: flex-end; }
  .scrim.open { display: flex; }
  .sheet { width: 100%; background: var(--paper); border-radius: 22px 22px 0 0; padding: 18px 16px 20px; }
  .sheet .pegon { font-size: 44px; text-align: center; line-height: 1.6; }
  .sheet p { margin: 0 0 10px; font-size: 14px; color: var(--ink-2); text-align: center; }
  .opts { display: grid; gap: 8px; margin: 10px 0; }
  .opts button { background: var(--white); border-radius: 12px; padding: 12px; font-weight: 700; text-align: left; border: 2px solid transparent; }
  .opts button[aria-pressed="true"] { border-color: var(--green); }
  .sheet input { width: 100%; font: inherit; padding: 12px; border-radius: 12px; border: 1.5px solid var(--ink-2); background: var(--white); margin-bottom: 10px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row .ok { background: var(--green); color: #fff; font-weight: 700; padding: 13px; border-radius: 12px; }
  .row .cancel { background: var(--paper-2); font-weight: 700; padding: 13px; border-radius: 12px; }
  [hidden] { display: none !important; }
</style>
</head>

  <header>
    <h1>Script Lens</h1>
    <span class="offline" data-t="offline"></span>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-id" aria-pressed="false">ID</button>
      <button id="lang-en" aria-pressed="true">EN</button>
    </div>
  </header>

  <main>
    <div class="demo-note" data-t="demoNote"></div>

    reset: "Ulangi demo",
    sheetQ: "Bagaimana Anda membaca kata ini?", inputPh: "Atau ketik bacaan yang benar", cancel: "Batal", confirm: "Konfirmasi",
  },
};

// state: "sure" (model confident), "flag" (uncertain), "kept" (keeper confirmed), "fixed" (keeper corrected)
const SAMPLE = [
  {
    pegon: "سرات ايكي ڤوساكاني ڤارا للوهور",
    meaning: "Naskah ini pusaka para leluhur.",
    words: [
      { p: "سرات", latin: "serat", gloss: "naskah" },
      { p: "ايكي", latin: "iki", gloss: "ini" },
      { p: "ڤوساكاني", latin: "pusakané", gloss: "pusakanya", flag: true, options: ["pusakané", "pusakani"] },
      { p: "ڤارا", latin: "para", gloss: "para" },
      { p: "للوهور", latin: "leluhur", gloss: "leluhur" },
    ],
  },
  {
    pegon: "علمو ايكو كودو ديواچا لن ديجاڮا",
    meaning: "Ilmu itu harus dibaca dan dijaga.",
    words: [
      { p: "علمو", latin: "ilmu", gloss: "ilmu" },
      { p: "ايكو", latin: "iku", gloss: "itu" },
      { p: "كودو", latin: "kudu", gloss: "harus" },
      { p: "ديواچا", latin: "diwaca", gloss: "dibaca", flag: true, options: ["diwaca", "dewaca"] },
      { p: "لن", latin: "lan", gloss: "dan" },
      { p: "ديجاڮا", latin: "dijaga", gloss: "dijaga" },
    ],
  },
];

const $ = id => document.getElementById(id);
let lang = "en", tier = "private", queue = 0, doc = null, active = null, choice = null;

const t = k => T[lang][k];
const freshDoc = () => SAMPLE.map(l => ({ ...l, words: l.words.map(w => ({ ...w, state: w.flag ? "flag" : "sure" })) }));
const allWords = () => doc.flatMap(l => l.words);
const pending = () => allWords().filter(w => w.state === "flag").length;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function renderStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(n => { n.textContent = t(n.dataset.t); });
  document.querySelectorAll("[data-tier]").forEach(b => { b.textContent = t(b.dataset.tier); });
  $("lang-en").setAttribute("aria-pressed", lang === "en");
  $("lang-id").setAttribute("aria-pressed", lang === "id");
  $("sheet-input").placeholder = t("inputPh");
  const pl = $("page-lines");
  pl.replaceChildren(...SAMPLE.map(l => el("div", "", l.pegon)));
}

function renderResult() {
  if (!doc) return;
  const left = pending(), words = allWords();
  const flaggedTotal = words.filter(w => w.flag).length;
  const checked = flaggedTotal - left;

  const s = $("status");
  s.className = "status " + (left ? "draft" : "verified");
  s.replaceChildren(el("b", "", left ? t("draftTitle") : t("okTitle")), document.createTextNode(left ? t("draftBody")(left) : t("okBody")));
  $("m-verified").textContent = checked + " / " + flaggedTotal;
  $("m-queue").textContent = queue;

  const wrap = $("lines");
  wrap.replaceChildren(...doc.map((line, li) => {
    const box = el("div", "line");
    box.append(el("div", "pegon", line.pegon));
    const ul = el("ul", "words");
    line.words.forEach((w, wi) => {
      const cls = w.state === "sure" ? "sure" : w.state === "flag" ? "flag" : "kept";
      const b = el("button", "word " + cls);
      b.type = "button";
      b.append(el("span", "dot", w.state === "flag" ? "?" : "✓"));
      const mid = el("span");
      mid.append(el("span", "latin", w.latin + (w.state === "flag" ? " ?" : "")), el("span", "gloss", w.gloss));
      mid.append(el("span", "tag", t({ sure: "tagSure", flag: "tagFlag", kept: "tagKept", fixed: "tagFixed" }[w.state])));
      b.append(mid, el("span", "pegon", w.p));
      b.addEventListener("click", () => openSheet(li, wi));
      const li_ = el("li"); li_.append(b); ul.append(li_);
    });
    box.append(ul);
    const g = el("p", "gloss-line");
    g.append(el("b", "", t("meaning") + ": "), document.createTextNode(line.meaning));
    box.append(g);
    return box;
  }));

  // an unverified draft can never be public
  const pub = document.querySelector('[data-tier="public"]');
  pub.disabled = left > 0;
  if (left > 0 && tier === "public") tier = "community";
  document.querySelectorAll("[data-tier]").forEach(b => b.setAttribute("aria-pressed", b.dataset.tier === tier));
  const hint = { private: "hintPrivate", community: "hintCommunity", public: "hintPublic" }[tier];
  $("tier-hint").textContent = t(hint) + (left > 0 ? " " + t("hintLocked") : "");
}

function openSheet(li, wi) {
  active = doc[li].words[wi];
  choice = active.latin;
  $("sheet-word").textContent = active.p;
  $("sheet-q").textContent = t("sheetQ");
  $("sheet-input").value = "";
  const opts = active.options || [active.latin];
  $("sheet-opts").replaceChildren(...opts.map(o => {
    const b = el("button", "", o);
    b.type = "button";
    b.setAttribute("aria-pressed", o === choice);
    b.addEventListener("click", () => {
      choice = o; $("sheet-input").value = "";
      $("sheet-opts").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    });
    return b;
  }));
  $("scrim").classList.add("open");
  $("sheet-ok").focus();
}
function closeSheet() { $("scrim").classList.remove("open"); active = null; }

$("sheet-ok").addEventListener("click", () => {
  if (!active) return;
  const typed = $("sheet-input").value.trim();
  const reading = typed || choice;
  const changed = reading !== active.latin;
  if (changed) { active.latin = reading; queue += 1; }      // a correction becomes training data
  else if (active.state === "flag") queue += 1;              // so does a confirmation of an uncertain word
  active.state = changed ? "fixed" : "kept";
  closeSheet(); renderResult();
});
$("sheet-cancel").addEventListener("click", closeSheet);
$("scrim").addEventListener("click", e => { if (e.target === $("scrim")) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

$("read").addEventListener("click", () => {
  const btn = $("read");
  btn.disabled = true; btn.textContent = t("reading");
  $("bar").classList.add("on");
  setTimeout(() => {
    doc = freshDoc(); queue = 0; tier = "private";
    $("capture").hidden = true; $("result").hidden = false;
    renderResult(); document.querySelector("main").scrollTop = 0;
  }, 1250);
});
$("reset").addEventListener("click", () => {
  doc = null; $("result").hidden = true; $("capture").hidden = false;
  $("bar").classList.remove("on"); $("read").disabled = false; $("read").textContent = t("readBtn");
  document.querySelector("main").scrollTop = 0;
});
document.querySelectorAll("[data-tier]").forEach(b => b.addEventListener("click", () => { tier = b.dataset.tier; renderResult(); }));
$("lang-en").addEventListener("click", () => { lang = "en"; renderStatic(); renderResult(); });
$("lang-id").addEventListener("click", () => { lang = "id"; renderStatic(); renderResult(); });

renderStatic();
</script>
</body>
</html>
